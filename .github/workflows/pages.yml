# Build the one-page site from confirmed records and publish it on GitHub Pages.
#
# Runs on every push to main, after every check run (a commit made by the check
# workflow's built-in token does not start other workflows by itself), and by hand.
# Needs Settings > Pages > Source set to "GitHub Actions".
#
# Action versions looked up on GitHub on 2026-11-20: checkout v7.0.1, setup-python v7.1.0,
# configure-pages v6.0.0, upload-pages-artifact v5.0.0, deploy-pages v5.0.1.
name: pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main   # after a check run, build from the commit it just made
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Build the page
        run: python -m pfrt build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
