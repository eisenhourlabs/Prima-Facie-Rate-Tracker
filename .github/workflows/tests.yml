# Run the test suite on every push and pull request.
# Action versions looked up on GitHub on 2026-11-20 (checkout v7.0.1, setup-python v7.1.0).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check config
        run: python -m pfrt config check
      - name: Run tests
        run: pytest
